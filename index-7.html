<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>익명 채팅방</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318; --panel: #1b1e27; --panel2: #242936;
      --text: #f3f4f8; --muted: #9ba3b4; --accent: #8b7cf6;
      --border: #303644; --danger: #ff7777;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; justify-content: center;
    }
    .app {
      width: 100%; max-width: 760px; min-height: 100vh; display: flex;
      flex-direction: column; background: var(--bg);
    }
    header {
      position: sticky; top: 0; z-index: 2; padding: 16px;
      background: rgba(27,30,39,.96); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    h1 { margin: 0; font-size: 18px; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .status { color: #83dfad; font-size: 12px; white-space: nowrap; }
    .notice {
      margin: 12px 14px 0; padding: 10px 12px; border-radius: 12px;
      background: #292641; color: #d9d4ff; font-size: 12px; line-height: 1.55;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px 14px 24px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .empty { color: var(--muted); text-align: center; margin: auto 0; font-size: 14px; }
    .message { max-width: 86%; align-self: flex-start; }
    .message.mine { align-self: flex-end; }
    .meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; margin: 0 7px 5px; }
    .bubble {
      padding: 10px 13px; border-radius: 16px; background: var(--panel2);
      overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.45; font-size: 14px;
    }
    .mine .bubble { background: #5146a5; }
    .message-actions { margin: 4px 7px 0; }
    .report { border: 0; background: transparent; color: var(--muted); font-size: 11px; padding: 3px; }
    .composer {
      position: sticky; bottom: 0; padding: 12px 14px max(12px, env(safe-area-inset-bottom));
      background: var(--panel); border-top: 1px solid var(--border);
    }
    .name-row { display: flex; gap: 8px; margin-bottom: 9px; }
    input, button { font: inherit; }
    input {
      min-width: 0; color: var(--text); background: var(--panel2);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    #nickname { width: 100%; font-size: 13px; padding: 9px 11px; }
    .send-row { display: flex; gap: 8px; }
    #messageInput { flex: 1; }
    button {
      border: 0; border-radius: 12px; padding: 0 17px; color: white;
      background: var(--accent); font-weight: 650; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #error { color: var(--danger); font-size: 12px; padding: 7px 2px 0; }
    .footer { color: var(--muted); font-size: 11px; text-align: center; padding-top: 8px; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>💬 익명 채팅방</h1>
        <div class="sub">누구나 참여할 수 있는 공개 채팅방</div>
      </div>
      <div class="status" id="status">연결 준비 중</div>
    </header>

    <div class="notice">
      개인정보(실명, 전화번호, 학교, 주소, 계정 정보)는 채팅에 올리지 마세요.
      불쾌하거나 위험한 메시지는 신고하고 대화를 중단하세요.
    </div>

    <section id="messages" aria-live="polite">
      <div class="empty" id="empty">채팅을 연결하고 있어요…</div>
    </section>

    <form class="composer" id="chatForm">
      <div class="name-row">
        <input id="nickname" maxlength="16" placeholder="익명 닉네임" aria-label="익명 닉네임">
      </div>
      <div class="send-row">
        <input id="messageInput" maxlength="500" placeholder="메시지를 입력하세요…" autocomplete="off" aria-label="메시지" required>
        <button id="sendButton" type="submit" disabled>전송</button>
      </div>
      <div id="error" role="status"></div>
      <div class="footer">메시지는 공개 채팅방의 모든 참여자에게 보입니다.</div>
    </form>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    /*
      1) Firebase 콘솔 > 프로젝트 설정 > 내 앱 > 웹 앱에서 설정값을 복사하세요.
      2) 아래 firebaseConfig의 안내 문구를 실제 값으로 바꾸세요.
      3) Firebase Authentication에서 익명 로그인을 켜고 Firestore Database를 만드세요.
    */
    const firebaseConfig = {
      apiKey: "AIzaSyDI9ygzpduvSXl8iayPFsJ0qTwrza9B6uY",
      authDomain: "anonymous-chat-9cc26.firebaseapp.com",
      projectId: "anonymous-chat-9cc26",
      storageBucket: "anonymous-chat-9cc26.firebasestorage.app",
      messagingSenderId: "20872212384",
      appId: "1:20872212384:web:1fcc2e28d084e6bde33ec5"
    };

    const messagesEl = document.getElementById("messages");
    const emptyEl = document.getElementById("empty");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const nicknameEl = document.getElementById("nickname");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chatForm = document.getElementById("chatForm");

    const randomName = "익명" + Math.floor(1000 + Math.random() * 9000);
    nicknameEl.value = randomName;

    const configReady = Object.values(firebaseConfig).every(
      value => value && !value.includes("여기에")
    );

    if (!configReady) {
      statusEl.textContent = "Firebase 설정 필요";
      emptyEl.textContent = "아직 Firebase 설정 전이에요. 파일 아래 안내에 따라 설정값을 넣으면 채팅이 시작됩니다.";
      errorEl.textContent = "Firebase 설정값이 아직 입력되지 않았습니다.";
    } else {
      try {
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const roomRef = db.collection("rooms").doc("lobby").collection("messages");
        let currentUid = null;
        let unsubscribe = null;

        auth.signInAnonymously().then(credential => {
          currentUid = credential.user.uid;
          statusEl.textContent = "실시간 연결됨";
          sendButton.disabled = false;

          unsubscribe = roomRef.orderBy("createdAt", "asc").limitToLast(100)
            .onSnapshot(snapshot => {
              messagesEl.innerHTML = "";
              if (snapshot.empty) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "첫 번째 메시지를 남겨보세요!";
                messagesEl.appendChild(empty);
              }
              snapshot.forEach(doc => renderMessage(doc.id, doc.data()));
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }, error => {
              statusEl.textContent = "연결 오류";
              errorEl.textContent = "메시지를 불러오지 못했어요. Firestore 보안 규칙을 확인해 주세요.";
              console.error(error);
            });
        }).catch(error => {
          statusEl.textContent = "로그인 오류";
          errorEl.textContent = "익명 로그인을 시작하지 못했어요. Firebase Authentication 설정을 확인해 주세요.";
          console.error(error);
        });

        function renderMessage(id, data) {
          const wrap = document.createElement("article");
          wrap.className = "message" + (data.uid === currentUid ? " mine" : "");

          const meta = document.createElement("div");
          meta.className = "meta";
          const name = document.createElement("span");
          name.textContent = String(data.nickname || "익명").slice(0, 16);
          const time = document.createElement("span");
          const date = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : null;
          time.textContent = date ? date.toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"}) : "방금";
          meta.append(name, time);

          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.textContent = String(data.text || "").slice(0, 500);
          wrap.append(meta, bubble);

          if (data.uid !== currentUid) {
            const actions = document.createElement("div");
            actions.className = "message-actions";
            const report = document.createElement("button");
            report.type = "button";
            report.className = "report";
            report.textContent = "신고";
            report.addEventListener("click", () => {
              alert("이 사이트의 운영자에게 메시지 내용과 시간을 전달해 주세요. 긴급하거나 위험한 상황이면 신뢰할 수 있는 어른에게도 알려주세요.");
            });
            actions.appendChild(report);
            wrap.appendChild(actions);
          }
          messagesEl.appendChild(wrap);
        }

        chatForm.addEventListener("submit", async event => {
          event.preventDefault();
          const text = messageInput.value.trim();
          const nickname = nicknameEl.value.trim().slice(0, 16) || randomName;
          if (!text || !currentUid) return;
          if (text.length > 500) {
            errorEl.textContent = "메시지는 500자까지 입력할 수 있어요.";
            return;
          }
          sendButton.disabled = true;
          errorEl.textContent = "";
          try {
            await roomRef.add({
              uid: currentUid,
              nickname,
              text,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            messageInput.value = "";
            messageInput.focus();
          } catch (error) {
            errorEl.textContent = "전송에 실패했어요. Firestore 보안 규칙을 확인해 주세요.";
            console.error(error);
          } finally {
            sendButton.disabled = false;
          }
        });

        window.addEventListener("beforeunload", () => {
          if (unsubscribe) unsubscribe();
        });
      } catch (error) {
        statusEl.textContent = "초기화 오류";
        errorEl.textContent = "Firebase 설정을 확인해 주세요.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
